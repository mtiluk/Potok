name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - run: go build ./...

      - run: go test -race ./...

      - uses: golangci/golangci-lint-action@v8
